name: Validate evidence and generate seed artifacts

on:
  push:
    branches: ["main"]
    paths:
      - "evidence/**"
      - "taxonomy/**"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/validate-and-generate.yml"
  pull_request:
    paths:
      - "evidence/**"
      - "taxonomy/**"
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/validate-and-generate.yml"
  workflow_dispatch:

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate evidence
        run: python src/validate_evidence.py
      - name: Validate parameter provenance
        run: python benchmarks/network_edge/validate_parameter_provenance.py

      - name: Generate seed artifacts
        run: python src/generate_seed_artifacts.py
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metaverse-seed-artifacts
          path: artifacts/generated/
