name: Export COMST source assets
on:
  push:
    paths:
      - '.github/workflows/export-comst-bib.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage source assets
        run: |
          mkdir -p export/source_assets
          cp paper_ready_results/metaverse_comst_master.bib export/metaverse_comst_master.bib
          cp -R paper_ready_results/figures export/source_assets/figures
          cp -R paper_ready_results/tables export/source_assets/tables
          cp -R paper_ready_results/algorithms export/source_assets/algorithms
      - uses: actions/upload-artifact@v4
        with:
          name: comst-source-assets
          path: export/
