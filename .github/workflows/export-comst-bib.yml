name: Export COMST bibliography
on:
  push:
    paths:
      - '.github/workflows/export-comst-bib.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage bibliography
        run: |
          mkdir -p export
          cp paper_ready_results/metaverse_comst_master.bib export/metaverse_comst_master.bib
      - uses: actions/upload-artifact@v4
        with:
          name: comst-master-bibliography
          path: export/metaverse_comst_master.bib
